version: '3.8'

services:
  # ==================== Infrastructure ====================

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - microservices-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    hostname: kafka
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - microservices-network

  # ==================== Microservices ====================

  product-service:
    build:
      context: .
      dockerfile: microservices/product-service/Dockerfile
    container_name: product-service
    ports:
      - "7001:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS=kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - microservices-network
    restart: on-failure

  recommendation-service:
    build:
      context: .
      dockerfile: microservices/recommendation-service/Dockerfile
    container_name: recommendation-service
    ports:
      - "7002:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS=kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - microservices-network
    restart: on-failure

  review-service:
    build:
      context: .
      dockerfile: microservices/review-service/Dockerfile
    container_name: review-service
    ports:
      - "7003:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS=kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - microservices-network
    restart: on-failure

  product-composite-service:
    build:
      context: .
      dockerfile: microservices/product-service-composite/Dockerfile
    container_name: product-composite-service
    ports:
      - "7000:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS=kafka:29092
      - APP_PRODUCT-SERVICE_HOST=product-service
      - APP_PRODUCT-SERVICE_PORT=8081
      - APP_RECOMMENDATION-SERVICE_HOST=recommendation-service
      - APP_RECOMMENDATION-SERVICE_PORT=8082
      - APP_REVIEW-SERVICE_HOST=review-service
      - APP_REVIEW-SERVICE_PORT=8083
    depends_on:
      product-service:
        condition: service_started
      recommendation-service:
        condition: service_started
      review-service:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - microservices-network
    restart: on-failure

networks:
  microservices-network:
    driver: bridge
