plugins {
	id 'org.springframework.boot' version '3.1.4' // Assurez-vous de spécifier la version correcte du plugin
	id 'io.spring.dependency-management' version '1.1.3'
	id 'java'
}

repositories {
	mavenCentral() // Déclarez Maven Central comme repository pour récupérer les dépendances
}
jar {
	enabled = false
}
test{
	useJUnitPlatform()
}

dependencies {
	implementation project(':API')
	implementation project(':Utils')

	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.projectreactor:reactor-test'
	// Lombok
	compileOnly 'org.projectlombok:lombok:1.18.30' // Ajout pour le build
	annotationProcessor 'org.projectlombok:lombok:1.18.30' // Ajout pour les annotations
}

java {
	sourceCompatibility = JavaVersion.VERSION_17  // Remplacez par votre version de Java
	targetCompatibility = JavaVersion.VERSION_17
}
